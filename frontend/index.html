<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Campus Lost & Found</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e){ var d=document.createElement('div'); d.style.cssText='position:fixed;top:0;left:0;right:0;background:#fef2f2;color:#c62828;padding:12px;font-family:monospace;z-index:9999;white-space:pre-wrap;'; d.textContent='Error: '+(e.message||e)+'\n'+(e.filename||'')+':'+(e.lineno||''); document.body.appendChild(d); });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
